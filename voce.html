<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Voce Audioguida - Nauticovi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 font-sans text-center">

    <div class="bg-slate-800 p-6 rounded-3xl border border-cyan-500/40 max-w-sm w-full space-y-4 shadow-2xl">
        <h2 class="text-lg font-black text-cyan-400">🔊 PROVA AUDIO NAUTICOVI</h2>
        <p class="text-xs text-slate-300">Clicca sul pulsante per ascoltare la voce ufficiale del tuo smartphone per la Grotta Azzurra:</p>

        <button onclick="testVoce('it')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-extrabold py-3.5 px-4 rounded-2xl shadow transition flex items-center justify-center gap-2 text-xs">
            🇮🇹 Prova Voce in Italiano
        </button>

        <button onclick="testVoce('en')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-extrabold py-3 px-4 rounded-2xl shadow transition flex items-center justify-center gap-2 text-xs">
            🇬🇧 Test English Voice
        </button>

        <div id="status-test" class="text-[11px] text-slate-400 italic pt-2">
            Verifica che il volume del telefono sia attivo.
        </div>
    </div>

    <script>
        function testVoce(lang) {
            if (!('speechSynthesis' in window)) {
                alert("Il tuo browser non supporta la sintesi vocale.");
                return;
            }

            window.speechSynthesis.cancel(); // Ferma eventuali letture precedenti

            const testi = {
                it: "Benvenuto all'Isola di Dino! Ti trovi all'ingresso della meravigliosa Grotta Azzurra. Procedi a motore al minimo per ammirare i riflessi cobalto del mare.",
                en: "Welcome to Dino Island! You are at the entrance of the Blue Grotto. Proceed at minimum speed to admire the bright cobalt water."
            };

            const utterance = new SpeechSynthesisUtterance(testi[lang]);
            utterance.lang = lang === 'en' ? 'en-US' : 'it-IT';
            utterance.rate = 0.95; // Velocità naturale di lettura

            document.getElementById('status-test').innerText = "🔊 Riproduzione in corso...";

            utterance.onend = function() {
                document.getElementById('status-test').innerText = "✅ Riproduzione completata!";
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
