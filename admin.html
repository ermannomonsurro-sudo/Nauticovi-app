<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAUTICOVI - Gestione Admin & Dashboard Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- SCHERMATA LOGIN ADMIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200 max-w-sm w-full space-y-4 text-center">
            <div class="flex flex-col items-center justify-center gap-2">
                <img src="logo.png" alt="Nauticovi Logo" class="h-16 w-auto object-contain">
                <h1 class="text-lg font-black text-slate-900 tracking-wider">NAUTICOVI ADMIN</h1>
            </div>
            <p class="text-xs text-slate-500">Inserisci la password riservata per accedere al gestionale cloud</p>
            <a href="index.html" class="inline-block text-xs text-cyan-600 font-bold hover:underline my-1">
                <i class="fa-solid fa-arrow-left"></i> Torna alla Home
            </a>
            
            <div class="space-y-3 pt-2">
                <input type="password" id="admin-pass" placeholder="Password" onkeyup="if(event.key === 'Enter') eseguiLogin()" class="w-full p-2.5 border rounded-xl text-center text-sm focus:ring-2 focus:ring-cyan-500 outline-none">
                <button type="button" onclick="eseguiLogin()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow transition text-xs cursor-pointer active:scale-95">
                    Accedi al Gestionale
                </button>
            </div>
            <p id="login-error" class="text-xs text-red-500 hidden font-bold">Password errata!</p>
        </div>
    </div>

    <!-- PANNELLO DOCK ADMIN -->
    <div id="admin-panel" class="hidden">
        <nav class="bg-slate-900 text-white p-4 shadow-xl border-b border-cyan-500/30 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center space-x-3">
                <div class="flex items-center gap-2"><img src="logo.png" alt="Nauticovi" class="h-8 w-auto object-contain"><span class="text-lg font-black tracking-widest text-cyan-400">NAUTICOVI</span></div>
                <span class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded font-bold uppercase flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> SUPABASE CLOUD LIVE
                </span>
            </div>
            <div class="flex gap-3 items-center">
                <a href="index.html" class="text-xs text-cyan-400 hover:text-white font-bold"><i class="fa-solid fa-house"></i> Home</a>
                <button onclick="logout()" class="text-xs text-slate-400 hover:text-white">Esci</button>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto p-4 lg:p-6 space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200 shadow-sm">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b pb-2 gap-2">
                    <h2 class="text-md font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-users text-cyan-600"></i> Anagrafica Noleggi & Web Check-in
                    </h2>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-100 border-b text-slate-700 font-bold uppercase text-[10px]">
                                <th class="p-2">Cliente</th>
                                <th class="p-2">Barca</th>
                                <th class="p-2">Data</th>
                                <th class="p-2">Importo</th>
                                <th class="p-2">Stato Check-in</th>
                                <th class="p-2">Azioni WhatsApp & Fattura</th>
                            </tr>
                        </thead>
                        <tbody id="clientiTable" class="divide-y">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://cbvpixcfhmedbapnvfmw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_V0B06YxZ1oW6tqg_6yx5og_OgbhxlUo";
        let _supabase;

        try {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {}

        function eseguiLogin() {
            const passInput = document.getElementById('admin-pass');
            if (passInput && passInput.value.trim() === 'nauticovi2026') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                sessionStorage.setItem('nauticovi_admin_auth', 'true');
                caricaDatiCloud();
                return false;
            } else {
                document.getElementById('login-error').classList.remove('hidden');
                return false;
            }
        }

        function logout() {
            sessionStorage.removeItem('nauticovi_admin_auth');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('nauticovi_admin_auth') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                caricaDatiCloud();
            }
        });

        // DATI FISSI FATTURE IN CLOUD
        const FIC_TOKEN = "a/eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJyZWYiOiI5MEJ3MXFMalhYdHlEZzkyZ1V4dFRya1dlenRiZ0Q0RCJ9.EZN6lLDpB17nhhlfm8M692e76zZ_ur_oR5tP4McU1Oo";
        const COMPANY_ID = "944372";

        async function generaFatturaInCloud(noleggioId) {
            const noleggio = listaNoleggi.find(n => n.id === noleggioId);
            if (!noleggio) return;

            let clienteData = {
                nome_cognome: noleggio.nome_cliente,
                cf_piva: "",
                email: "",
                indirizzo: "Praia a Mare",
                cap: "87028",
                citta: "Praia a Mare"
            };

            try {
                const { data: checkinData } = await _supabase.from('checkin').select('*').eq('noleggio_id', noleggioId).maybeSingle();
                if (checkinData) clienteData = checkinData;
            } catch (err) {}

            const conferma = confirm(`🚀 Vuoi generare la BOZZA di Fattura per ${clienteData.nome_cognome} (€${noleggio.importo}) su Fatture in Cloud?`);
            if (!conferma) return;

            const payload = {
                data: {
                    type: "invoice",
                    entity: {
                        name: clienteData.nome_cognome,
                        vat_number: clienteData.cf_piva || null,
                        tax_code: clienteData.cf_piva || null,
                        address_street: clienteData.indirizzo,
                        address_postal_code: clienteData.cap,
                        address_city: clienteData.citta,
                        email: clienteData.email || null
                    },
                    date: noleggio.data_noleggio,
                    is_draft: true,
                    items_list: [
                        {
                            name: `Noleggio imbarcazione ${noleggio.barca} - Data: ${noleggio.data_noleggio}`,
                            qty: 1,
                            net_price: parseFloat((parseFloat(noleggio.importo) / 1.22).toFixed(2)),
                            vat: { id: 0, value: 22 }
                        }
                    ]
                }
            };

            try {
                // Invocazione della Serverless Function sicura
                const res = await fetch("/api/fattura", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: FIC_TOKEN, companyId: COMPANY_ID, payload })
                });

                const data = await res.json();

                if (res.ok && data.data) {
                    alert(`✅ BOZZA CREATA SU FATTURE IN CLOUD!\n\nID Bozza: ${data.data.id}\nIl documento è stato salvato nella sezione "Bozze" del tuo account Fatture in Cloud!`);
                    await _supabase.from('noleggi').update({ stato_fattura: 'emessa' }).eq('id', noleggioId);
                    caricaDatiCloud();
                } else {
                    const msg = data.error ? (data.error.message || JSON.stringify(data.error)) : 'Parametri non validi';
                    alert(`❌ Errore Fatture in Cloud:\n${msg}`);
                }
            } catch (err) {
                alert(`❌ Errore di rete: ${err.message}`);
            }
        }

        let listaNoleggi = [];

        async function caricaDatiCloud() {
            if(!_supabase) return;
            const { data } = await _supabase.from('noleggi').select('*').order('data_noleggio', { ascending: false });
            listaNoleggi = data || [];
            renderTable(listaNoleggi);
        }

        function renderTable(noleggi) {
            const tbody = document.getElementById('clientiTable');
            if(!tbody) return;
            tbody.innerHTML = '';

            noleggi.forEach((n) => {
                const badgeCheckin = n.stato_checkin === 'completato' 
                    ? `<span class="bg-emerald-100 text-emerald-800 text-[9px] font-bold px-2 py-0.5 rounded-full uppercase">✓ Completato</span>`
                    : `<span class="bg-amber-100 text-amber-800 text-[9px] font-bold px-2 py-0.5 rounded-full uppercase">⌛ In Attesa</span>`;

                const btnFattura = `<button onclick="generaFatturaInCloud('${n.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded-lg font-bold text-[10px] flex items-center gap-1 shadow">
                    <i class="fa-solid fa-file-invoice-dollar"></i> Genera FIC
                   </button>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="p-2 font-bold text-slate-800">${n.nome_cliente}</td>
                        <td class="p-2 font-semibold text-cyan-700">${n.barca}</td>
                        <td class="p-2 font-mono text-slate-600">${n.data_noleggio}</td>
                        <td class="p-2 font-bold text-emerald-600">€${n.importo}</td>
                        <td class="p-2">${badgeCheckin}</td>
                        <td class="p-2 flex gap-2 items-center">${btnFattura}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
